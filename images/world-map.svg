<?xml version="1.0" encoding="UTF-8"?>
<!-- WGIH stylised world map (equirectangular, 1000x500).
     Continents are simplified silhouettes; a lat/long graticule gives it the
     geospatial feel. Country office markers are added as HTML overlays in
     index.html (positioned with the same projection), not baked into this
     file, so they can blink and carry tooltips. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="World map">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#054d36"/>
      <stop offset="55%" stop-color="#0b6e4f"/>
      <stop offset="100%" stop-color="#0a5a8a"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.10)"/>
    </linearGradient>
  </defs>

  <!-- Ocean -->
  <rect width="1000" height="500" fill="url(#ocean)"/>

  <!-- Graticule -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <line x1="0" y1="83"  x2="1000" y2="83"/>
    <line x1="0" y1="167" x2="1000" y2="167"/>
    <line x1="0" y1="250" x2="1000" y2="250"/>
    <line x1="0" y1="333" x2="1000" y2="333"/>
    <line x1="0" y1="417" x2="1000" y2="417"/>
    <line x1="125" y1="0" x2="125" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="375" y1="0" x2="375" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="625" y1="0" x2="625" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="875" y1="0" x2="875" y2="500"/>
  </g>

  <!-- Continents (simplified silhouettes) -->
  <g fill="url(#land)" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-linejoin="round">
    <!-- North America -->
    <path d="M70,70 L210,55 L300,80 L285,120 L250,130 L255,160 L220,175 L205,205 L185,200 L175,165 L150,150 L120,120 L95,110 Z"/>
    <!-- Central America -->
    <path d="M205,205 L240,215 L265,245 L255,255 L235,240 L215,220 Z"/>
    <!-- South America -->
    <path d="M300,250 L340,245 L365,275 L360,320 L335,370 L315,400 L300,385 L295,340 L285,300 L290,265 Z"/>
    <!-- Greenland -->
    <path d="M330,35 L380,30 L395,60 L365,80 L335,65 Z"/>
    <!-- Africa -->
    <path d="M470,175 L545,165 L575,180 L585,210 L600,230 L595,265 L575,310 L555,345 L535,330 L520,290 L495,255 L478,225 L465,200 Z"/>
    <!-- Europe -->
    <path d="M470,105 L540,95 L575,110 L560,135 L525,150 L495,145 L475,130 Z"/>
    <!-- Asia -->
    <path d="M575,95 L700,70 L820,80 L905,100 L930,135 L890,160 L820,165 L760,150 L700,165 L655,160 L610,145 L580,130 Z"/>
    <!-- Southeast Asia / islands -->
    <path d="M820,220 L870,215 L905,235 L885,255 L845,250 L825,235 Z"/>
    <!-- Australia -->
    <path d="M840,290 L915,285 L935,320 L900,345 L855,335 L835,310 Z"/>
  </g>
</svg>
